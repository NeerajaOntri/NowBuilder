databases:
  - name: nowbuilder-db
    databaseName: nowbuilder
    user: nowbuilder
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: nowbuilder
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NOWBUILDER_ENVIRONMENT
        value: production
      - key: NOWBUILDER_DATABASE_URL
        fromDatabase:
          name: nowbuilder-db
          property: connectionString
      - key: NOWBUILDER_SECRET_KEY
        generateValue: true
      - key: NOWBUILDER_ENCRYPTION_KEY
        sync: false
      - key: NOWBUILDER_AUTO_DEPLOY
        value: "false"
      - key: NOWBUILDER_SIGNUP_MODE
        value: approval
